name: Senda
options:
  bundleIdPrefix: dev.kisnner
  deploymentTarget:
    iOS: '26.0'
settings:
  base:
    SWIFT_VERSION: '6.0'
    SWIFT_STRICT_CONCURRENCY: complete
    TARGETED_DEVICE_FAMILY: '1'
targets:
  Senda:
    type: application
    platform: iOS
    sources: [Senda]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.kisnner.senda
        INFOPLIST_FILE: Senda/Resources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: '0.1.0'
        CURRENT_PROJECT_VERSION: '1'
    scheme:
      testTargets: [SendaTests]
  SendaTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: Senda
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
